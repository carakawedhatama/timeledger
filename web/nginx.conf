server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Look the API up per request: a recreated container gets a new IP, and a fixed upstream would 502 until restart.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:8080;

  location /api/  { proxy_pass $api; }
  location /mock/ { proxy_pass $api; }
  location /swagger { proxy_pass $api; }

  # SPA fallback for vue-router history mode
  location / {
    # The token is readable by script, so only this origin's scripts may run.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ /index.html;
  }
}
